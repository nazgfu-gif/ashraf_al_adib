<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أشرف الأديب — بطاقة رقمية</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.14);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 20%, rgba(16, 185, 129, 0.16), transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(59, 130, 246, 0.16), transparent 45%),
        var(--bg-dark);
      color: var(--text-main);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 14px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .name {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }

    .role {
      font-size: 0.92rem;
      color: var(--accent-amber);
      font-weight: 600;
    }

    .phone-box {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }

    .phone-meta {
      text-align: right;
    }

    .phone-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .phone-number {
      font-size: 1.05rem;
      font-weight: 700;
      direction: ltr;
      text-align: right;
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 9px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .breakers-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .breaker {
      background: rgba(10, 15, 28, 0.85);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .breaker:active {
      transform: scale(0.97);
    }

    .breaker-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .led {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-red);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
      transition: all 0.2s ease;
    }

    .breaker.active .led {
      background: var(--accent-green);
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.9);
    }

    .breaker-name {
      font-size: 1rem;
      font-weight: 700;
    }

    .switch-pill {
      width: 64px;
      padding: 5px 0;
      border-radius: 999px;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 800;
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.45);
    }

    .breaker.active .switch-pill {
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
      border-color: rgba(34, 197, 94, 0.5);
    }

    .breaker-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .status-msg {
      min-height: 22px;
      text-align: center;
      font-size: 0.82rem;
      color: #86efac;
      margin-bottom: 14px;
    }

    .footer {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
      direction: ltr;
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="header">
      <h1 class="name">أشرف الأديب</h1>
      <p class="role">فني كهرباء وتمديدات</p>
    </header>

    <section class="phone-box">
      <div class="phone-meta">
        <div class="phone-label">رقم التواصل المباشر</div>
        <div class="phone-number" id="phoneNumber">00963933681019</div>
      </div>
      <button class="copy-btn" type="button" id="copyBtn">نسخ الرقم</button>
    </section>

    <div class="panel-title">
      <span>لوحة القواطع التفاعلية</span>
      <span>OFF ← ON</span>
    </div>

    <section class="breakers-grid">
      <div class="breaker" data-action="call" role="button" tabindex="0">
        <div class="breaker-top">
          <span class="led"></span>
          <span>C20</span>
        </div>
        <div class="breaker-name">اتصال</div>
        <div class="switch-pill">OFF</div>
        <div class="breaker-hint">اضغط هنا</div>
      </div>

      <div class="breaker" data-action="whatsapp" role="button" tabindex="0">
        <div class="breaker-top">
          <span class="led"></span>
          <span>C16</span>
        </div>
        <div class="breaker-name">واتساب</div>
        <div class="switch-pill">OFF</div>
        <div class="breaker-hint">اضغط هنا</div>
      </div>

      <div class="breaker" data-action="save" role="button" tabindex="0">
        <div class="breaker-top">
          <span class="led"></span>
          <span>C10</span>
        </div>
        <div class="breaker-name">حفظ الرقم</div>
        <div class="switch-pill">OFF</div>
        <div class="breaker-hint">اضغط هنا</div>
      </div>

      <div class="breaker" data-action="facebook" role="button" tabindex="0">
        <div class="breaker-top">
          <span class="led"></span>
          <span>C25</span>
        </div>
        <div class="breaker-name">فيسبوك</div>
        <div class="switch-pill">OFF</div>
        <div class="breaker-hint">اضغط هنا</div>
      </div>
    </section>

    <div class="status-msg" id="statusMsg"></div>

    <footer class="footer">Made By Nazeh Aladib</footer>
  </main>

  <script>
    const phone = "00963933681019";
    const intlPhone = "963933681019";
    const statusMsg = document.getElementById("statusMsg");
    const copyBtn = document.getElementById("copyBtn");

    function showStatus(text) {
      statusMsg.textContent = text;
    }

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(phone);
        showStatus("تم نسخ الرقم بنجاح");
      } catch {
        const temp = document.createElement("textarea");
        temp.value = phone;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
        showStatus("تم نسخ الرقم بنجاح");
      }
    });

    function downloadVCard() {
      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "N:الأديب;أشرف;;;",
        "FN:أشرف الأديب",
        "TITLE:فني كهرباء وتمديدات",
        `TEL;TYPE=CELL:${phone}`,
        "END:VCARD"
      ].join("\n");

      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Ashraf-Al-Adib.vcf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showStatus("تم تجهيز ملف حفظ جهة الاتصال");
    }

    document.querySelectorAll(".breaker").forEach((breaker) => {
      const pill = breaker.querySelector(".switch-pill");
      const action = breaker.dataset.action;

      function trigger() {
        breaker.classList.add("active");
        pill.textContent = "ON";

        if (action === "call") {
          showStatus("جاري فتح الاتصال...");
          window.location.href = `tel:${phone}`;
        } else if (action === "whatsapp") {
          showStatus("جاري فتح واتساب...");
          window.open(`https://wa.me/${intlPhone}`, "_blank", "noopener,noreferrer");
        } else if (action === "save") {
          downloadVCard();
        } else if (action === "facebook") {
          showStatus("جاري فتح فيسبوك...");
          window.open("https://www.facebook.com/", "_blank", "noopener,noreferrer");
        }

        setTimeout(() => {
          breaker.classList.remove("active");
          pill.textContent = "OFF";
        }, 1800);
      }

      breaker.addEventListener("click", trigger);
      breaker.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          trigger();
        }
      });
    });
  </script>
</body>
</html>
